<style>
:root {
  --шрифт-заголовков: Manrope, system-ui, sans-serif;
  --шрифт-текста: Manrope, system-ui, sans-serif;
  --цвет-фон: #FFF8F0;  --цвет-фон-2: #EAFDFC;  --цвет-фон-карточки: #FFFFFF;
  --цвет-текст: #24132F;  --цвет-текст-мягкий: #664D70;
  --цвет-акцент: #00AFA8;  --цвет-акцент-тёмный: #007E79;  --цвет-акцент-яркий: #62D8D1;  --цвет-на-акценте: #FFFFFF;
  --цвет-акцент-глубже: #00958F;  --цвет-акцент-маркер: #00AFA8;  --цвет-текст-тихий: #A992B1;
  --цвет-линия: #B9E9E6;
  --цвет-тёмный-фон: #24132F;  --цвет-тёмный-фон-2: #432056;  --цвет-тёмный-текст: #FFF8F0;
  --цвет-тёмный-фон-3: #32183F;  --цвет-тёмный-фон-4: #512966;
  --цвет-тёплый: #FFD43B;  --цвет-тёплый-мягкий: #FFB7DF;
  --цвет-стекло: color-mix(in srgb, #24132F 86%, transparent);
  --тень: 0 10px 28px color-mix(in srgb, #24132F 10%, transparent);
  --тень-чип: 0 9px 24px color-mix(in srgb, #24132F 16%, transparent);
  --тень-глубокая: 0 22px 52px color-mix(in srgb, #24132F 32%, transparent);
  --тень-спутник: 0 28px 56px color-mix(in srgb, #24132F 55%, transparent);
  --тень-плиты: 0 36px 90px color-mix(in srgb, #24132F 65%, transparent);
  --кегль-h1: 34px;  --кегль-h2: clamp(25px, 3.8vw, 38px);
  --кегль-текст: clamp(16px, 1.2vw, 18px);  --кегль-лид: clamp(17px, 1.2vw, 19px);
  --кегль-мелкий: 14px;  --кегль-кикер: clamp(14px, 1.1vw, 15px);  --кегль-цифра: 30px;
  --разрядка-кикера: .02em;
  --отступ-секции: clamp(52px, 8vw, 108px);  --отступ-секции-тихо: clamp(41px, 6.3vw, 84px);  --отступ-секции-громко: clamp(60px, 9.3vw, 125px);
  --отступ-блока: clamp(15px, 1.8vw, 25px);  --ширина: 1160px;  --ширина-колонки: 570px;
  --радиус: 12px;  --радиус-малый: 6px;  --радиус-карточки: 16px;  --радиус-плитки: 18px;  --радиус-телефон: 40px;
  --радиус-модуля: 14px;  --нить: 1.5px;  --кнопка-радиус: 12px;
  --плавность: cubic-bezier(.2, .7, .2, 1);  --длительность: .22s;
}
@media (min-width: 900px) { :root { --кегль-h1: clamp(46px, 4.1vw, 60px); } }
@media (max-width: 899px) { .первый-экран--разворот .список-иконок, .первый-экран--разворот .лид, .первый-экран--разворот .кнопка--контур { color: #24132F; } }
.шапка__лиц > .иконка { display: none; }
@media (max-width: 899px) { .шапка__лиц .полн { white-space: nowrap; } }
.первый-экран--разворот { min-height: 100svh; }
:root, .светлый { --цвет-кнопки: #F326A5; --цвет-на-кнопке: #24132F; --цвет-кнопки-навёл: #F54DB5; }
.тёмный { --цвет-кнопки: #00AFA8; --цвет-на-кнопке: #24132F; --цвет-кнопки-навёл: #00D8CF; }

</style>
<script>
(function () {
  var ЭТАЛОН = 0.535;                  // очко Open Sans — текстовой гарнитуры утверждённых макетов
  var ПОТОЛОК = 1.2, МЁРТВАЯ = 0.02;   // выше потолка расползается раскладка; ближе к единице не трогаем вовсе
  var КОМПЬЮТЕР = "(min-width: 900px)";
  var ТОКЕНЫ = ["--кегль-текст", "--кегль-лид", "--кегль-мелкий", "--кегль-кикер"];
  var корень = document.documentElement;
  var холст = document.createElement("canvas").getContext("2d");
  var ждём = 0;

  function мера(буква) { var м = холст.measureText(буква); return (м && м.actualBoundingBoxAscent) || 0; }

  function применить() {
    ждём = 0;
    if (!холст) { return; }

    for (var i = 0; i < ТОКЕНЫ.length; i++) { корень.style.removeProperty(ТОКЕНЫ[i]); }
    var стиль = getComputedStyle(корень), стек = стиль.getPropertyValue("--шрифт-текста").trim();
    if (!стек) { return; }
    холст.font = "400 100px " + стек;

    var очко = Math.max(мера("х"), мера("x")) / 100;
    if (!(очко > 0)) { return; }
    var k = Math.round(Math.min(ПОТОЛОК, Math.max(1, ЭТАЛОН / очко)) * 1000) / 1000;
    if (k - 1 < МЁРТВАЯ || !matchMedia(КОМПЬЮТЕР).matches) { k = 1; }
    корень.setAttribute("data-очко", очко.toFixed(3));      // чтобы проверка могла сказать числа вслух
    корень.setAttribute("data-поправка", k.toFixed(3));
    if (k === 1) { return; }
    for (i = 0; i < ТОКЕНЫ.length; i++) {
      var было = стиль.getPropertyValue(ТОКЕНЫ[i]).trim();
      if (было) { корень.style.setProperty(ТОКЕНЫ[i], "calc((" + было + ") * " + k + ")"); }
    }
  }

  применить();

  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(применить); }

  addEventListener("resize", function () { ждём = ждём || requestAnimationFrame(применить); });
})();
</script>
</head>
<body class="с-липкой-кнопкой">
<section class="блок блок--первый-экран первый-экран--разворот тёмный сторона--слева" id="экран-1" data-тип="первый-экран" data-схема="разворот" data-ключ-макета="светлая" data-картинка="фото">

      <p class="кикер"><svg class="иконка" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M13 2L4 14h7l-1 8 9-12h-7z"/>
</svg>Ольга Судзиловская</p>
      <h1>НейроОля</h1>
      <p class="лид">Для дела и для себя</p>
      <ul class="список-иконок">
        <li><i class="галка"></i><span>Визуалы с ИИ</span></li>

    </div>
    <figure class="картинка картинка--фото картинка--край первый-экран__картинка" style="--лицо-в-кадре: .22">
      <picture><source media="(max-width: 899px)" srcset="img/olga-cover.webp"><img src="img/olga-cover.webp" alt="Ольга Судзиловская — визуальный дизайнер с ИИ" data-лицо="50,22" fetchpriority="high"></picture>
    </figure>

</section>
<span id="экран-2" hidden></span>
<div class="липкая-кнопка липкая-кнопка--тёмная"><a class="кнопка кнопка--главная" href="https://vk.me/olsud_toys">Написать во ВКонтакте</a></div>
<script>
(function () {
  var СПИТ = "главная-на-виду";                       // класс на body; правило сна — в стилях
  var кнопка = document.querySelector(".первый-экран__действие .кнопка--главная");
  if (!кнопка || !window.IntersectionObserver) { return; }

  function пометить(на_виду) { document.body.classList.toggle(СПИТ, !!на_виду); }

  var б = кнопка.getBoundingClientRect();
  пометить(б.bottom > 0 && б.top < (window.innerHeight || 0));

  requestAnimationFrame(function () {
    requestAnimationFrame(function () { document.body.classList.add("панель-с-переходом"); });
  });

  new IntersectionObserver(function (записи) {
    пометить(записи[записи.length - 1].isIntersecting);
  }, { threshold: 0 }).observe(кнопка);
})();
</script>
